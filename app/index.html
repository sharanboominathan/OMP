    <!-- Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How far in advance should we book?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We accept only 12 weddings per year, and our calendar typically fills 14 to 20 months in advance. We recommend reaching out as soon as you have a date in mind. A 30% deposit secures your date immediately."
          }
        },
        {
          "@type": "Question",
          "name": "Do you travel for weddings outside Chennai?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. We regularly travel across Tamil Nadu and the rest of India for weddings, and we are happy to travel internationally for destination weddings as well. Travel fees vary by location and are quoted transparently before booking."
          }
        },
        {
          "@type": "Question",
          "name": "What is your editing style?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We describe our work as fine-art documentary. We do not use heavy presets or HDR processing. Images are colour-graded to feel timeless, warm, and filmic. The goal is that your photographs look extraordinary in 30 years."
          }
        },
        {
          "@type": "Question",
          "name": "How many images will we receive?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Full-day coverage typically yields 700 to 900 fully edited, high-resolution images delivered via a private online gallery. We do not deliver unedited files. Every image is individually retouched."
          }
        },
        {
          "@type": "Question",
          "name": "What is your turnaround time?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Your online gallery will be delivered within 10 to 14 weeks. A sneak preview of 30 to 40 images is shared within 72 hours of your wedding day so you can begin sharing with family."
          }
        },
        {
          "@type": "Question",
          "name": "Do you offer albums and prints?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. We design bespoke lay-flat albums and offer fine-art prints. Contact us for current album and print pricing — packages are tailored to your requirements."
          }
        },
        {
          "@type": "Question",
          "name": "What if our venue has low light?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Low light is where we excel. We use a hybrid mix of natural light, carefully placed off-camera flash, and available ambient lighting. We scout every venue before the wedding day to understand the light conditions."
          }
        }
      ]
    }
    </script>
